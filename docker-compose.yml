services:
  # --- Real Postgres, running locally ---
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: "-d 1"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-main}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Neon HTTP/WS proxy: lets @neondatabase/serverless + @prisma/adapter-neon
  # talk to the plain Postgres container above. Without this, DATABASE_URL
  # pointed at `postgres` directly will NOT work - the Neon serverless
  # driver doesn't speak raw Postgres wire protocol. ---
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    restart: unless-stopped
    environment:
      - PG_CONNECTION_STRING=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-main}
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-main}
      JWT_SECRET: ${JWT_SECRET:-wellqc-development-secret-key-change-in-production-12345}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      neon-proxy:
        condition: service_started
      backend:
        condition: service_started
    environment:
      NODE_ENV: development
      USE_LOCAL_NEON_PROXY: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@neon-proxy/${POSTGRES_DB:-main}
      DIRECT_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-main}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-main}
      PYTHON_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      # Shows the container the practice settings instead of your real
      # .env and .env.local files
      - ./.env.docker:/app/.env:ro
      - ./.env.docker:/app/.env.local:ro
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  frontend_node_modules:
