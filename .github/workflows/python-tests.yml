name: python-tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PY_TEST_DATABASE_URL }}
      PY_TEST_DATABASE_URL: ${{ secrets.PY_TEST_DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.PY_TEST_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to run against Primary
        run: |
          host=$(echo "$DATABASE_URL" | sed 's/^.*@//; s/\/.*$//')
          case "$host" in *ep-divine-field*) echo "DATABASE_URL points at Primary"; exit 1;; esac

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt pytest

      - name: Warm up Neon (cold start)
        env:
          PYTHONPATH: .
        run: |
          for i in 1 2 3 4 5; do
            python -c "from backend.app.core.database import engine; engine.connect().close()" && exit 0
            echo "Attempt $i failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - run: pytest -q