name: python-tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "data/**"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PY_TEST_DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.PY_TEST_AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt pytest

      - name: Check DATABASE_URL shape
        run: |
          echo "length: ${#DATABASE_URL}"
          echo "starts: ${DATABASE_URL:0:12}"
          case "$DATABASE_URL" in *[[:space:]]*) echo "HAS WHITESPACE";; esac
          case "$DATABASE_URL" in *\'*|*\"*) echo "HAS QUOTE";; esac
      - name: Warm up Neon (cold start)
        run: |
          for i in 1 2 3 4 5; do
            python -c "import os, sqlalchemy as sa; e=sa.create_engine(os.environ['DATABASE_URL']); e.connect().execute(sa.text('SELECT 1'))" && exit 0
            echo "Attempt $i failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - run: pytest -q